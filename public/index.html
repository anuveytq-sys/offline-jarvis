<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>JARVIS</title>

<style>

/* =========================================================
   JARVIS — HIGH TECH HUD
   GUI ONLY
   Backend endpoints remain:
   /api/command
   /api/voice
   ========================================================= */

:root {
  --blue: #00bfff;
  --cyan: #00eaff;
  --deep-blue: #0066ff;
  --dark: #020814;
  --panel: rgba(3, 20, 38, 0.58);
  --panel2: rgba(2, 30, 52, 0.42);
  --line: rgba(0, 210, 255, 0.35);
  --text: #d9f8ff;
  --muted: #66a8bb;
  --danger: #ff4d7d;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #01050d;
  color: var(--text);
  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
}

body {
  position: relative;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -10;

  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(0, 120, 255, 0.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 10%,
      rgba(0, 220, 255, 0.08),
      transparent 25%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(0, 100, 255, 0.09),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #01040a,
      #03111e 50%,
      #01050d
    );
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -9;
  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(0, 190, 255, 0.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0, 190, 255, 0.035) 1px,
      transparent 1px
    );

  background-size: 42px 42px;

  mask-image:
    radial-gradient(
      ellipse at center,
      black 20%,
      transparent 85%
    );
}

/* =========================================================
   PARTICLES
   ========================================================= */

.particles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -5;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--cyan);
  border-radius: 50%;
  opacity: 0.45;
  box-shadow: 0 0 8px var(--cyan);

  animation: particleFloat linear infinite;
}

.particle:nth-child(1) {
  left: 8%;
  top: 25%;
  animation-duration: 11s;
}

.particle:nth-child(2) {
  left: 18%;
  top: 75%;
  animation-duration: 15s;
}

.particle:nth-child(3) {
  left: 31%;
  top: 16%;
  animation-duration: 13s;
}

.particle:nth-child(4) {
  left: 47%;
  top: 85%;
  animation-duration: 17s;
}

.particle:nth-child(5) {
  left: 62%;
  top: 22%;
  animation-duration: 12s;
}

.particle:nth-child(6) {
  left: 74%;
  top: 67%;
  animation-duration: 16s;
}

.particle:nth-child(7) {
  left: 88%;
  top: 30%;
  animation-duration: 14s;
}

.particle:nth-child(8) {
  left: 94%;
  top: 82%;
  animation-duration: 18s;
}

@keyframes particleFloat {
  0% {
    transform: translateY(30px);
    opacity: 0;
  }

  20% {
    opacity: 0.5;
  }

  80% {
    opacity: 0.5;
  }

  100% {
    transform: translateY(-120px);
    opacity: 0;
  }
}

/* =========================================================
   MAIN APPLICATION
   ========================================================= */

.app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
  position: absolute;
  top: 18px;
  left: 22px;
  right: 22px;

  height: 58px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  z-index: 30;

  padding: 0 18px;

  border: 1px solid rgba(0, 210, 255, 0.22);
  background: rgba(1, 13, 25, 0.58);
  backdrop-filter: blur(14px);

  clip-path:
    polygon(
      0 0,
      calc(100% - 15px) 0,
      100% 15px,
      100% 100%,
      15px 100%,
      0 calc(100% - 15px)
    );

  box-shadow:
    0 0 30px rgba(0, 150, 255, 0.05);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-orb {
  width: 30px;
  height: 30px;
  border-radius: 50%;

  border: 1px solid var(--cyan);

  box-shadow:
    0 0 10px rgba(0, 234, 255, 0.8),
    inset 0 0 12px rgba(0, 180, 255, 0.5);

  position: relative;

  animation: brandPulse 2s infinite;
}

.brand-orb::before,
.brand-orb::after {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  border: 1px solid var(--blue);
}

.brand-orb::after {
  inset: 12px;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  border: 0;
}

@keyframes brandPulse {
  50% {
    transform: scale(1.08);
  }
}

.brand-name {
  letter-spacing: 5px;
  font-size: 20px;
  font-weight: 300;
}

.brand-sub {
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 3px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;

  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);

  box-shadow:
    0 0 7px var(--cyan),
    0 0 15px rgba(0, 220, 255, 0.5);

  animation: statusPulse 1.5s infinite;
}

@keyframes statusPulse {
  50% {
    opacity: 0.35;
  }
}

/* =========================================================
   GENERIC HUD PANEL
   ========================================================= */

.hud-panel {
  position: absolute;

  background:
    linear-gradient(
      135deg,
      rgba(0, 40, 70, 0.48),
      rgba(1, 10, 23, 0.62)
    );

  border: 1px solid rgba(0, 210, 255, 0.28);

  backdrop-filter: blur(12px);

  box-shadow:
    inset 0 0 25px rgba(0, 170, 255, 0.035),
    0 0 25px rgba(0, 120, 255, 0.04);

  overflow: hidden;

  clip-path:
    polygon(
      0 0,
      calc(100% - 13px) 0,
      100% 13px,
      100% 100%,
      13px 100%,
      0 calc(100% - 13px)
    );
}

.hud-panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14px;
  right: 14px;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      transparent
    );

  opacity: 0.5;
}

.hud-panel::after {
  content: "";
  position: absolute;
  width: 35%;
  height: 100%;
  top: 0;
  left: -50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0, 220, 255, 0.06),
      transparent
    );

  transform: skewX(-20deg);

  animation: panelScan 7s linear infinite;
}

@keyframes panelScan {
  0% {
    left: -50%;
  }

  100% {
    left: 150%;
  }
}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  font-size: 9px;
  letter-spacing: 2.5px;
  color: var(--cyan);

  margin-bottom: 12px;
}

.panel-code {
  color: #397b91;
  font-size: 7px;
}

/* =========================================================
   TOP LEFT — NEURAL CORE
   ========================================================= */

.neural-panel {
  top: 95px;
  left: 22px;
  width: 270px;
  height: 175px;

  padding: 16px;
}

.neural-svg {
  width: 100%;
  height: 125px;
}

.neural-line {
  stroke: var(--blue);
  stroke-width: 0.8;
  opacity: 0.48;
}

.neural-node {
  fill: #041a2c;
  stroke: var(--cyan);
  stroke-width: 1;

  filter:
    drop-shadow(
      0 0 4px rgba(0, 220, 255, 0.7)
    );

  animation: neuralPulse 2.4s infinite;
}

.neural-node:nth-child(2n) {
  animation-delay: 0.6s;
}

.neural-node:nth-child(3n) {
  animation-delay: 1.1s;
}

@keyframes neuralPulse {
  50% {
    fill: rgba(0, 190, 255, 0.28);
  }
}

/* =========================================================
   TOP RIGHT — AI ANALYTICS
   ========================================================= */

.analytics-panel {
  top: 95px;
  right: 22px;
  width: 295px;
  height: 205px;

  padding: 16px;
}

.analytics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.analytics-card {
  border: 1px solid rgba(0, 200, 255, 0.15);
  background: rgba(0, 60, 90, 0.12);

  padding: 9px;

  min-height: 55px;
}

.analytics-label {
  font-size: 7px;
  letter-spacing: 1.5px;
  color: #568fa2;
}

.analytics-value {
  font-size: 15px;
  margin-top: 5px;
  color: var(--text);
}

.analytics-bars {
  height: 38px;

  display: flex;
  align-items: end;
  gap: 4px;

  margin-top: 10px;
}

.analytics-bars span {
  flex: 1;
  background: linear-gradient(
    to top,
    rgba(0, 120, 255, 0.25),
    var(--cyan)
  );

  min-height: 4px;

  animation: bars 1.5s ease-in-out infinite alternate;
}

.analytics-bars span:nth-child(1) {
  height: 30%;
}

.analytics-bars span:nth-child(2) {
  height: 55%;
  animation-delay: .1s;
}

.analytics-bars span:nth-child(3) {
  height: 38%;
  animation-delay: .2s;
}

.analytics-bars span:nth-child(4) {
  height: 80%;
  animation-delay: .3s;
}

.analytics-bars span:nth-child(5) {
  height: 60%;
  animation-delay: .4s;
}

.analytics-bars span:nth-child(6) {
  height: 92%;
  animation-delay: .5s;
}

.analytics-bars span:nth-child(7) {
  height: 45%;
  animation-delay: .6s;
}

.analytics-bars span:nth-child(8) {
  height: 72%;
  animation-delay: .7s;
}

@keyframes bars {
  to {
    transform: scaleY(.55);
  }
}

/* =========================================================
   CENTRAL AI CORE
   ========================================================= */

.center {
  position: absolute;
  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: min(560px, 54vw);
  height: min(560px, 54vw);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 10;

  transition: transform .35s ease;
}

.center::before {
  content: "";
  position: absolute;
  inset: 12%;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(0, 190, 255, 0.09),
      transparent 63%
    );

  filter: blur(3px);
}

/* =========================================================
   ORBITAL SYSTEM
   ========================================================= */

.reactor {
  position: relative;

  width: 280px;
  height: 280px;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: transform .4s ease;
}

.ring {
  position: absolute;

  border-radius: 50%;

  border: 1px solid rgba(0, 210, 255, 0.42);

  box-shadow:
    0 0 15px rgba(0, 180, 255, 0.08),
    inset 0 0 15px rgba(0, 180, 255, 0.04);
}

.ring.one {
  width: 280px;
  height: 280px;

  border-top-color: var(--cyan);
  border-bottom-color: transparent;

  animation:
    spin 15s linear infinite;
}

.ring.two {
  width: 225px;
  height: 225px;

  border-left-color: var(--blue);
  border-right-color: transparent;

  animation:
    spinReverse 11s linear infinite;
}

.ring.three {
  width: 175px;
  height: 175px;

  border-top-color: rgba(0, 234, 255, 0.8);
  border-bottom-color: transparent;

  animation:
    spin 8s linear infinite;
}

.ring.four {
  width: 130px;
  height: 130px;

  border-left-color: rgba(0, 150, 255, 0.8);
  border-right-color: transparent;

  animation:
    spinReverse 6s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes spinReverse {
  to {
    transform: rotate(-360deg);
  }
}

/* =========================================================
   ORBITAL NODES
   ========================================================= */

.orbit-node {
  position: absolute;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--cyan);

  box-shadow:
    0 0 7px var(--cyan),
    0 0 17px rgba(0, 200, 255, 0.7);
}

.node-a {
  top: 22px;
  left: 136px;
}

.node-b {
  right: 26px;
  top: 135px;
}

.node-c {
  bottom: 24px;
  left: 134px;
}

.node-d {
  left: 27px;
  top: 135px;
}

/* =========================================================
   CORE
   ========================================================= */

.core {
  width: 96px;
  height: 96px;

  border-radius: 50%;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle,
      rgba(0, 234, 255, 0.34),
      rgba(0, 50, 100, 0.24) 45%,
      transparent 72%
    );

  border: 1px solid rgba(0, 234, 255, 0.85);

  box-shadow:
    0 0 20px rgba(0, 200, 255, 0.5),
    0 0 60px rgba(0, 130, 255, 0.28),
    inset 0 0 25px rgba(0, 220, 255, 0.35);

  animation: corePulse 2.4s infinite;
}

.core::before {
  content: "";

  position: absolute;
  width: 38px;
  height: 38px;

  border-radius: 50%;

  border: 1px solid var(--cyan);

  box-shadow:
    0 0 14px var(--cyan),
    inset 0 0 12px var(--cyan);

  animation: coreInner 2s infinite;
}

.core::after {
  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 0 8px white,
    0 0 20px var(--cyan);
}

@keyframes corePulse {
  50% {
    transform: scale(1.05);
  }
}

@keyframes coreInner {
  50% {
    transform: rotate(180deg) scale(.8);
  }
}

/* =========================================================
   SYSTEM TEXT
   ========================================================= */

.system-text {
  position: absolute;

  bottom: 17%;

  left: 50%;

  transform: translateX(-50%);

  text-align: center;

  width: 400px;

  pointer-events: none;
}

.system-title {
  font-size: 12px;

  letter-spacing: 5px;

  color: var(--cyan);

  text-shadow:
    0 0 10px rgba(0, 220, 255, 0.7);
}

.system-message {
  margin-top: 8px;

  font-size: 10px;

  color: #629caf;

  letter-spacing: 1.5px;

  min-height: 16px;
}

/* =========================================================
   BOTTOM LEFT — VOICE ANALYZER
   ========================================================= */

.voice-panel {
  left: 22px;
  bottom: 110px;

  width: 300px;
  height: 175px;

  padding: 16px;
}

.voice-wave {
  position: relative;

  width: 100%;
  height: 70px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 3px;

  overflow: hidden;
}

.voice-wave span {
  display: block;

  width: 3px;

  height: 12px;

  border-radius: 3px;

  background: var(--cyan);

  box-shadow:
    0 0 7px rgba(0, 220, 255, 0.7);

  animation: waveform 1s ease-in-out infinite;
}

.voice-wave span:nth-child(1) { animation-delay: -.8s; }
.voice-wave span:nth-child(2) { animation-delay: -.5s; }
.voice-wave span:nth-child(3) { animation-delay: -.2s; }
.voice-wave span:nth-child(4) { animation-delay: -.7s; }
.voice-wave span:nth-child(5) { animation-delay: -.3s; }
.voice-wave span:nth-child(6) { animation-delay: -.9s; }
.voice-wave span:nth-child(7) { animation-delay: -.4s; }
.voice-wave span:nth-child(8) { animation-delay: -.1s; }
.voice-wave span:nth-child(9) { animation-delay: -.6s; }
.voice-wave span:nth-child(10) { animation-delay: -.2s; }
.voice-wave span:nth-child(11) { animation-delay: -.7s; }
.voice-wave span:nth-child(12) { animation-delay: -.4s; }
.voice-wave span:nth-child(13) { animation-delay: -.8s; }
.voice-wave span:nth-child(14) { animation-delay: -.3s; }
.voice-wave span:nth-child(15) { animation-delay: -.6s; }
.voice-wave span:nth-child(16) { animation-delay: -.1s; }
.voice-wave span:nth-child(17) { animation-delay: -.5s; }
.voice-wave span:nth-child(18) { animation-delay: -.2s; }
.voice-wave span:nth-child(19) { animation-delay: -.9s; }
.voice-wave span:nth-child(20) { animation-delay: -.4s; }

@keyframes waveform {
  0%,
  100% {
    height: 8px;
    opacity: .4;
  }

  50% {
    height: 52px;
    opacity: 1;
  }
}

.voice-status {
  display: flex;
  justify-content: space-between;

  font-size: 8px;

  color: #538a9e;

  letter-spacing: 1.5px;
}

/* =========================================================
   BOTTOM RIGHT — RADAR
   ========================================================= */

.radar-panel {
  right: 22px;
  bottom: 110px;

  width: 280px;
  height: 210px;

  padding: 16px;
}

.radar {
  width: 145px;
  height: 145px;

  margin: 0 auto;

  border-radius: 50%;

  position: relative;

  background:
    radial-gradient(
      circle,
      transparent 0 22%,
      rgba(0, 200, 255, .05) 23% 24%,
      transparent 25% 44%,
      rgba(0, 200, 255, .05) 45% 46%,
      transparent 47% 68%,
      rgba(0, 200, 255, .05) 69% 70%,
      transparent 71%
    );

  border: 1px solid rgba(0, 220, 255, .35);

  box-shadow:
    0 0 25px rgba(0, 170, 255, .08),
    inset 0 0 25px rgba(0, 170, 255, .05);

  overflow: hidden;
}

.radar::before {
  content: "";

  position: absolute;

  width: 50%;
  height: 1px;

  left: 50%;
  top: 50%;

  transform-origin: left center;

  background:
    linear-gradient(
      90deg,
      var(--cyan),
      transparent
    );

  box-shadow:
    0 0 8px var(--cyan);

  animation: radarSweep 3s linear infinite;
}

.radar::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;
  bottom: 0;

  width: 1px;

  background:
    rgba(0, 220, 255, .14);
}

.radar-horizontal {
  position: absolute;

  top: 50%;
  left: 0;
  right: 0;

  height: 1px;

  background:
    rgba(0, 220, 255, .14);
}

@keyframes radarSweep {
  to {
    transform: rotate(360deg);
  }
}

.radar-dot {
  position: absolute;

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: var(--cyan);

  box-shadow:
    0 0 9px var(--cyan);

  animation: radarDot 1.8s infinite;
}

.radar-dot.one {
  left: 68%;
  top: 31%;
}

.radar-dot.two {
  left: 27%;
  top: 64%;

  animation-delay: .6s;
}

.radar-dot.three {
  left: 73%;
  top: 73%;

  animation-delay: 1s;
}

@keyframes radarDot {
  50% {
    transform: scale(1.8);
    opacity: .45;
  }
}

/* =========================================================
   BOTTOM COMMAND AREA
   ========================================================= */

.bottom {
  position: absolute;

  left: 22px;
  right: 22px;
  bottom: 18px;

  z-index: 40;
}

.command-row {
  height: 54px;

  display: flex;

  gap: 8px;
}

.command-input {
  flex: 1;

  min-width: 0;

  border: 1px solid rgba(0, 210, 255, 0.28);

  outline: none;

  color: var(--text);

  background:
    rgba(1, 16, 29, 0.78);

  backdrop-filter: blur(12px);

  padding: 0 18px;

  font-size: 12px;

  letter-spacing: .7px;

  clip-path:
    polygon(
      0 0,
      calc(100% - 12px) 0,
      100% 12px,
      100% 100%,
      12px 100%,
      0 calc(100% - 12px)
    );
}

.command-input::placeholder {
  color: #426f80;
}

.command-input:focus {
  border-color: rgba(0, 230, 255, .65);

  box-shadow:
    0 0 20px rgba(0, 190, 255, .08);
}

button {
  border: 1px solid rgba(0, 210, 255, .35);

  background:
    rgba(0, 60, 90, .25);

  color: var(--cyan);

  cursor: pointer;

  font-size: 9px;

  letter-spacing: 1.5px;

  padding: 0 20px;

  transition:
    background .2s,
    box-shadow .2s,
    transform .2s;
}

button:hover {
  background:
    rgba(0, 150, 220, .18);

  box-shadow:
    0 0 18px rgba(0, 210, 255, .14);
}

button:active {
  transform: scale(.97);
}

.voice {
  min-width: 75px;
}

.voice.active {
  background:
    rgba(0, 200, 255, .22);

  box-shadow:
    0 0 20px rgba(0, 220, 255, .25);
}

/* =========================================================
   LOG
   ========================================================= */

.log {
  position: absolute;

  left: 50%;

  bottom: 78px;

  transform: translateX(-50%);

  width: min(650px, 70vw);

  max-height: 100px;

  overflow: hidden;

  pointer-events: none;

  text-align: center;
}

.log-line {
  font-size: 9px;

  color: #477e91;

}

}

@keyframes logIn {

}

<script>

/* =========================================================
   JARVIS GUI CONTROLLER
   IMPORTANT:
   Backend endpoints are unchanged.
   ========================================================= */

const input =
  document.getElementById("input");

const sendButton =
  document.getElementById("sendButton");

const voiceButton =
  document.getElementById("voiceButton");

const message =
  document.getElementById("message");

const log =
  document.getElementById("log");

const reactor =
  document.getElementById("reactor");

const center =
  document.getElementById("center");

const statusText =
  document.getElementById("statusText");

const voiceState =
  document.getElementById("voiceState");


/* =========================================================
   LOG
   ========================================================= */

function addLog(
  type,
  text
) {

  const line =
    document.createElement("div");

  line.className =
    `log-line ${type}`;

  line.textContent =
    text;

  log.appendChild(line);

  while (
    log.children.length > 4
  ) {
    log.removeChild(
      log.firstChild
    );
  }

}


/* =========================================================
   MESSAGE
   ========================================================= */

function setMessage(text) {

  message.textContent =
    text;

}


/* =========================================================
   THINKING
   ========================================================= */

function thinking(state) {

  center.classList.toggle(
    "thinking",
    state
  );

  if (state) {

    statusText.textContent =
      "PROCESSING";

  } else {

    statusText.textContent =
      "SYSTEM ONLINE";

  }

}


/* =========================================================
   LISTENING
   ========================================================= */

function listening(state) {

  reactor.classList.toggle(
    "listening",
    state
  );

  voiceButton.classList.toggle(
    "active",
    state
  );

  voiceState.textContent =
    state
      ? "LISTENING"
      : "STANDBY";

}


/* =========================================================
   SEND COMMAND
   ========================================================= */

async function sendCommand(
  text
) {

  const command =
    String(text || "")
      .trim();

  if (!command) {

    setMessage(
      "Please enter a command."
    );

    return;

  }

  input.value = "";

  addLog(
    "user",
    `YOU: ${command}`
  );

  setMessage(
    "Processing command..."
  );

  thinking(true);

  try {

    /*
     * KEEP THIS ENDPOINT UNCHANGED
     */

    const response =
      await fetch(
        "/api/command",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              command
            })
        }
      );

    const data =
      await response.json();

    const reply =
      data.reply ||
      "Command completed.";

    addLog(
      "jarvis",
      `JARVIS: ${reply}`
    );

    setMessage(reply);

  } catch (error) {

    console.error(error);

    addLog(
      "jarvis",
      "JARVIS: Connection error."
    );

    setMessage(
      "I couldn't connect to the JARVIS command system."
    );

  } finally {

    thinking(false);

  }

}


/* =========================================================
   VOICE COMMAND
   ========================================================= */

async function voiceCommand() {

  listening(true);

  thinking(false);

  setMessage(
    "Listening..."
  );

  addLog(
    "jarvis",
    "JARVIS: Listening..."
  );

  try {

    /*
     * KEEP THIS ENDPOINT UNCHANGED
     */

    const response =
      await fetch(
        "/api/voice",
        {
          method: "POST"
        }
      );

    const data =
      await response.json();

    const reply =
      data.reply ||
      "Command completed.";

    if (data.command) {

      addLog(
        "user",
        `YOU: ${data.command}`
      );

    }

    addLog(
      "jarvis",
      `JARVIS: ${reply}`
    );

    setMessage(reply);

  } catch (error) {

    console.error(error);

    addLog(
      "jarvis",
      "JARVIS: Voice command failed."
    );

    setMessage(
      "Voice command failed."
    );

  } finally {

    listening(false);

  }

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
  "click",
  () => {

    sendCommand(
      input.value
    );

  }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendCommand(
        input.value
      );

    }

  }
);


/* =========================================================
   VOICE BUTTON
   ========================================================= */

voiceButton.addEventListener(
  "click",
  voiceCommand
);


/* =========================================================
   INITIAL GUI STATE
   ========================================================= */

setMessage(
  "Awaiting command."
);

statusText.textContent =
  "SYSTEM ONLINE";

</script>
